services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corvax
      POSTGRES_USER: corvax
      POSTGRES_PASSWORD: ${CORVAX_DB_PASSWORD:?Set CORVAX_DB_PASSWORD}
    volumes:
      - corvax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvax -d corvax"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${CORVAX_DATABASE_URL:?Set CORVAX_DATABASE_URL}
      SECRET_KEY: ${CORVAX_SECRET_KEY:?Set CORVAX_SECRET_KEY}
      SEED_DEMO_DATA: "true"
      ALLOWED_ORIGINS: http://localhost:8000
      TRUSTED_HOSTS: localhost,127.0.0.1
      FORCE_HTTPS: "false"
      DOCS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - corvax_backups:/app/data/backups

volumes:
  corvax_pgdata:
  corvax_backups:
