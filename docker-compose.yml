services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corvax
      POSTGRES_USER: corvax
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - corvax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvax -d corvax"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://corvax:change-this-local-password@db:5432/corvax
      SECRET_KEY: local-development-secret-change-before-production-123456789
      SEED_DEMO_DATA: "false"
      ALLOWED_ORIGINS: http://localhost:8000
      TRUSTED_HOSTS: localhost,127.0.0.1
      FORCE_HTTPS: "false"
      DOCS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - corvax_backups:/app/data/backups

volumes:
  corvax_pgdata:
  corvax_backups:
